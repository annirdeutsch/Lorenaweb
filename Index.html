        /* --- CONFIGURACIÓN BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #03030c; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; user-select: none; overflow-x: hidden; }

        /* --- ENTORNO 3D Y CARRUSEL --- */
        .carousel-container { position: relative; width: 100%; height: 540px; display: flex; justify-content: center; align-items: center; perspective: 1500px; cursor: grab; touch-action: none; }
        .carousel-container:active { cursor: grabbing; }

        /* --- ESTRUCTURA DE LAS TARJETAS --- */
        .card { position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateY(calc((var(--item) - 1) * 120deg)) translateZ(300px); filter: blur(4px) grayscale(30%); opacity: 0.35; transition: filter 0.6s ease, opacity 0.6s ease; pointer-events: none; }
        .card.active { filter: blur(0px) grayscale(0%); opacity: 1; pointer-events: auto; }
        
        .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .card-inner.flipped { transform: rotateY(180deg); }
        
        /* --- CARAS FRONT / BACK --- */
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; background-size: cover; background-position: center; text-align: center; gap: 8px; }
        
        .card-front { background-image: linear-gradient(rgba(15, 12, 30, 0.82), rgba(15, 12, 30, 0.58)), var(--bg-img); border: 1px solid rgba(157, 0, 255, 0.3); box-shadow: 0 0 30px rgba(157, 0, 255, 0.15); color: white; }
        .card-back { background-image: linear-gradient(rgba(30, 10, 50, 0.75), rgba(30, 10, 50, 0.45)), var(--bg-img); border: 1px solid rgba(255, 0, 127, 0.4); box-shadow: 0 0 30px rgba(255, 0, 127, 0.5); transform: rotateY(180deg); }

            border: none; border-radius: 25px; color: white; font-weight: bold; font-size: 0.9rem; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            animation: pulseButton 2s infinite ease-in-out;

            opacity: 0; transform: scale(0.8);

        .card-inner.flipped .action-btn { opacity: 1; transform: scale(1); transition: opacity 0.4s ease 0.2s, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s; }

        @keyframes pulseButton {

        @media (max-width: 600px) {

    </style>

    <script>
        const container = document.querySelector('.carousel-container');
        const carousel = document.querySelector('.carousel');
        const cards = document.querySelectorAll('.card');

        let isDragging = false;
        let startX = 0;
        let currentRotation = 0;
        let totalDragMovement = 0;

        function getTranslateZ() {
            return window.innerWidth <= 600 ? 200 : 300;
        }

        function updateFocus() {
            let normalizedRotation = (currentRotation % 360 + 360) % 360;
            let targetIndex = Math.round(normalizedRotation / 120) % 3;
            
            if (targetIndex !== 0) {
                targetIndex = 3 - targetIndex;
            }

            cards.forEach((card, index) => {
                if (index === targetIndex) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                    card.querySelector('.card-inner').classList.remove('flipped');
                }
            });
        }

        function startDrag(e) {
            isDragging = true;
            totalDragMovement = 0;
            carousel.style.transition = 'none'; 
            startX = e.pageX || e.touches[0].pageX;
        }

        function doDrag(e) {
            if (!isDragging) return;
            const x = e.pageX || (e.touches && e.touches[0].pageX);
            if (!x) return;

            const deltaX = x - startX;
            totalDragMovement += Math.abs(deltaX);

            currentRotation += deltaX * 0.35; 
            carousel.style.transform = `rotateY(${currentRotation}deg)`;
            startX = x;
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;

            carousel.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
            currentRotation = Math.round(currentRotation / 120) * 120;
            carousel.style.transform = `rotateY(${currentRotation}deg)`;
            
            updateFocus();
        }

        container.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', doDrag);
        window.addEventListener('mouseup', endDrag);

        container.addEventListener('touchstart', startDrag, { passive: true });
        window.addEventListener('touchmove', doDrag, { passive: true });
        window.addEventListener('touchend', endDrag);

        cards.forEach(card => {
            const inner = card.querySelector('.card-inner');
            
            inner.addEventListener('click', (e) => {
                if (card.classList.contains('active') && totalDragMovement < 6) {
                    inner.classList.toggle('flipped');
                }
            });

            const actionBtn = card.querySelector('.action-btn');
            actionBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                window.location.href = 'https://clicknlook.site/a/wpRWzCyOp7I1z5W';
            });
        });

        window.addEventListener('resize', () => {
            carousel.style.transform = `rotateY(${currentRotation}deg)`;
            updateFocus();
        });

        updateFocus();
    </script>
